[package]
name = "bookrecord"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Market-data recorder: rebuild L2 order books from exchange websocket streams with gap detection, checksum or sequence validation, compressed on-disk capture, and measured processing latency."
repository = "https://github.com/Intermountainh8ter/bookrecord"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zstd = "0.14"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
rust_decimal = { version = "1", features = ["serde"] }
crc32fast = "1"
